<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Duygu Dedektifi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,700;1,900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      height: 100%;
      font-family: 'Nunito', system-ui, sans-serif;
      background: #FAF7F2;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }
    #root {
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    @keyframes enter {
      from { opacity: 0; transform: translateY(16px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes card-in {
      0%   { opacity: 0; transform: translateY(24px) scale(0.94); }
      60%  { transform: translateY(-4px) scale(1.02); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .enter    { animation: enter 0.4s cubic-bezier(0.2,0.8,0.2,1) both; }
    .card-in  { animation: card-in 0.5s cubic-bezier(0.2,0.8,0.2,1) both; }
  </style>
</head>
<body>
<div id="root"></div>
<script src="js/data/emotions.js"></script>
<script src="js/data/scenes.js"></script>
<script type="text/babel">

function shuffle(arr) {
  const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a;
}

/* ─── RAINBOW RINGS ─────────────────────────────────────────── */
function RainbowRings({ size = 12 }) {
  return (
    <span style={{
      display:'inline-block', width:size, height:size, borderRadius:'50%',
      background:'#FF4757', flexShrink:0,
      boxShadow:`0 0 0 ${size*0.2}px #FF8C42,0 0 0 ${size*0.4}px #FFC93C,0 0 0 ${size*0.6}px #2ED573,0 0 0 ${size*0.8}px #2E9CFF,0 0 0 ${size*1.0}px #3D5AFE,0 0 0 ${size*1.2}px #B14AED`
    }}/>
  );
}

/* ─── STEP DOTS ─────────────────────────────────────────────── */
function StepDots({ active }) {
  return (
    <div style={{ display:'flex', gap:8, justifyContent:'center', padding:'10px 0 0' }}>
      {[1,2].map(n => (
        <div key={n} style={{
          width:6, height:6, borderRadius:'50%',
          background:'#1A1A1A',
          opacity: active===n ? 1 : 0.18,
          transform: active===n ? 'scale(1.5)' : 'scale(1)',
          transition:'all 0.3s cubic-bezier(0.2,0.8,0.2,1)',
        }}/>
      ))}
    </div>
  );
}

/* ─── DECK VISUAL ───────────────────────────────────────────── */
function DeckVisual({ icon, label, sub, onClick, playerGrad }) {
  const [hovered, setHovered] = React.useState(false);
  const iconBg = playerGrad || 'linear-gradient(135deg,#B14AED,#3D5AFE)';
  return (
    <div
      onClick={onClick}
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => setHovered(false)}
      style={{ position:'relative', width:'min(200px, 52vw)', aspectRatio:'5/7', cursor:'pointer', userSelect:'none' }}
    >
      {[
        { r:-6, tx:-10, ty:6, op:0.45 },
        { r: 4, tx:  8, ty:3, op:0.65 },
      ].map((c,i) => (
        <div key={i} style={{
          position:'absolute', inset:0, borderRadius:20,
          background:'#fff', border:'1px solid rgba(0,0,0,0.07)',
          transform:`rotate(${c.r}deg) translate(${c.tx}px,${c.ty}px)`,
          opacity:c.op,
        }}/>
      ))}
      <div style={{
        position:'absolute', inset:0, borderRadius:20,
        background:'#fff', border:'1px solid rgba(0,0,0,0.06)',
        display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:14,
        boxShadow:'0 24px 48px -16px rgba(0,0,0,0.14)',
        transform: hovered ? 'translateY(-8px)' : 'translateY(0)',
        transition:'transform 0.3s cubic-bezier(0.2,0.8,0.2,1)',
      }}>
        <div style={{
          width:56, height:56, borderRadius:'50%', background:iconBg, color:'#fff',
          display:'flex', alignItems:'center', justifyContent:'center', fontSize:26, fontWeight:900,
          boxShadow:'0 8px 20px -6px rgba(0,0,0,0.25)',
        }}>{icon}</div>
        <div style={{ textAlign:'center' }}>
          <div style={{ fontWeight:900, fontSize:'clamp(16px,4vw,20px)', color:'#1A1A1A', lineHeight:1.1 }}>{label}</div>
          <div style={{ fontSize:9, letterSpacing:'0.25em', color:'#A0A0A0', textTransform:'uppercase', marginTop:8 }}>{sub}</div>
        </div>
      </div>
    </div>
  );
}

/* ─── EMOTION CARD ──────────────────────────────────────────── */
function EmotionCard({ emotion, group, onShown, animKey, onRedraw }) {
  const [revealed, setRevealed] = React.useState(false);
  const [entered, setEntered] = React.useState(false);
  React.useEffect(() => {
    setEntered(false); setRevealed(false);
    const t = setTimeout(() => { setEntered(true); if (onShown) onShown(); }, 60);
    return () => clearTimeout(t);
  }, [animKey]);
  const fontSize = emotion.length > 10 ? 'clamp(24px,7vw,34px)' : emotion.length > 7 ? 'clamp(30px,9vw,42px)' : 'clamp(36px,11vw,52px)';

  return (
    <div
      onClick={() => setRevealed(r => !r)}
      style={{
        width:'min(260px, 66vw)', aspectRatio:'5/7', borderRadius:24,
        background:group.grad,
        display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
        position:'relative', overflow:'hidden',
        boxShadow:'0 32px 64px -24px rgba(0,0,0,0.3)',
        userSelect:'none', cursor:'pointer',
        transform: entered ? 'translateY(0) scale(1)' : 'translateY(24px) scale(0.95)',
        opacity: entered ? 1 : 0,
        transition:'transform 0.5s cubic-bezier(0.2,0.8,0.2,1), opacity 0.5s',
      }}
    >
      <div style={{
        color:group.text, fontWeight:900, fontSize, lineHeight:1, textAlign:'center', padding:'0 20px',
        filter: revealed ? 'blur(0)' : 'blur(20px)',
        transition: revealed ? 'filter 0.18s ease-out' : 'filter 0.45s ease-in-out',
      }}>{emotion}</div>

      <div style={{
        position:'absolute', inset:0,
        display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:10,
        opacity: revealed ? 0 : 1, transition:'opacity 0.2s', pointerEvents:'none',
      }}>
        <div style={{
          width:40, height:40, borderRadius:'50%',
          border:`1.5px solid ${group.text==='white'?'rgba(255,255,255,0.8)':'rgba(58,42,0,0.6)'}`,
          display:'flex', alignItems:'center', justifyContent:'center',
        }}>
          <div style={{ width:11, height:11, borderRadius:'50%', background:group.text==='white'?'rgba(255,255,255,0.8)':'rgba(58,42,0,0.6)' }}/>
        </div>
        <div style={{
          fontSize:9, letterSpacing:'0.22em', textTransform:'uppercase', textAlign:'center', lineHeight:1.5,
          color:group.text==='white'?'rgba(255,255,255,0.85)':'rgba(58,42,0,0.65)',
        }}>Görmek için<br/>dokun</div>
      </div>

      {onRedraw && (
        <IconChangeBtn
          onClick={e => { e.stopPropagation(); onRedraw(); }}
          onMouseDown={e => e.stopPropagation()}
          onTouchStart={e => { e.stopPropagation(); }}
          style={{ position:'absolute', top:14, right:14 }}
        />
      )}
    </div>
  );
}

/* ─── MINI CHIP ─────────────────────────────────────────────── */
function MiniChip({ emotion, group }) {
  const [revealed, setRevealed] = React.useState(false);
  React.useEffect(() => { setRevealed(false); }, [emotion]);
  return (
    <div
      onClick={() => setRevealed(r => !r)}
      style={{
        borderRadius:20, overflow:'hidden',
        width:'min(280px, 72vw)',
        cursor:'pointer', userSelect:'none',
        boxShadow:`0 2px 8px -4px rgba(0,0,0,0.14)`,
      }}
    >
      <div style={{
        display:'flex', alignItems:'center', gap:12,
        padding:'12px 18px',
        background: group.grad,
        filter: revealed ? 'blur(0)' : 'blur(5px)',
        transition: revealed ? 'filter 0.18s ease-out' : 'filter 0.45s ease-in-out',
        willChange:'filter',
      }}>
        <div style={{
          width:40, height:40, borderRadius:'50%', background:'rgba(255,255,255,0.25)', flexShrink:0,
          display:'flex', alignItems:'center', justifyContent:'center',
        }}>
          <div style={{ width:17, height:17, borderRadius:'50%', background:'rgba(255,255,255,0.6)' }}/>
        </div>
        <span style={{
          fontWeight:900, fontStyle:'italic', fontSize:20, color: group.text,
          letterSpacing:'-0.01em', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap',
          userSelect:'none',
        }}>{emotion}</span>
      </div>
    </div>
  );
}

/* ─── SCENE CARD ────────────────────────────────────────────── */
function SceneCard({ scene, animKey, displayNum, onChangeScene, group, dark }) {
  const [entered, setEntered] = React.useState(false);
  React.useEffect(() => {
    setEntered(false);
    const t = setTimeout(() => setEntered(true), 60);
    return () => clearTimeout(t);
  }, [animKey]);
  return (
    <div style={{
      width:'min(280px, 72vw)', aspectRatio:'5/7',
      borderRadius:24, flexShrink:0,
      background: dark ? '#1A1A1A' : '#fff',
      boxShadow:'0 48px 96px -24px rgba(0,0,0,0.32), 0 16px 32px -12px rgba(0,0,0,0.12)',
      display:'flex', flexDirection:'column',
      position:'relative', overflow:'hidden',
      transform: entered ? 'translateY(0) scale(1)' : 'translateY(28px) scale(0.95)',
      opacity: entered ? 1 : 0,
      transition:'transform 0.5s cubic-bezier(0.2,0.8,0.2,1), opacity 0.5s',
    }}>

      {/* ── Sahne no — sol üst ── */}
      <div style={{
        position:'absolute', top:'clamp(14px,3.5vw,18px)', left:'clamp(16px,4vw,22px)',
        fontSize:8, letterSpacing:'0.28em', color: dark ? 'rgba(255,255,255,0.2)' : '#D0D0D0', textTransform:'uppercase', fontWeight:700,
      }}>
        №{String(displayNum).padStart(2,'0')}
      </div>

      {/* ── Sahne değiştir — sağ üst, duygu rengi ── */}
      {onChangeScene && (
        <IconChangeBtn
          onClick={onChangeScene}
          accentGrad={group && group.grad}
          accentText={dark ? '#1A1A1A' : (group && group.text)}
          invertPress={dark}
          style={{ position:'absolute', top:'clamp(10px,2.5vw,14px)', right:'clamp(10px,2.5vw,14px)' }}
        />
      )}

      {/* ── Sahne metni ── */}
      <div style={{
        flex:1,
        padding:'clamp(22px,6vw,32px) clamp(22px,6vw,30px) clamp(16px,4vw,20px)',
        display:'flex', alignItems:'center',
      }}>
        <p style={{
          fontSize:'clamp(17px,5vw,21px)',
          lineHeight:1.75,
          color: dark ? '#fff' : '#1A1A1A',
          fontWeight:600,
          margin:0,
          letterSpacing:'-0.01em',
        }}>
          {scene.body}
        </p>
      </div>

      {/* ── Ayırıcı ── */}
      <div style={{
        margin:'0 clamp(22px,6vw,30px)',
        height:1,
        background: dark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.08)',
        flex:'0 0 auto',
      }}/>

      {/* ── Soru ── */}
      <div style={{
        flex:'0 0 auto',
        background: group ? group.grad : '#F7F4EE',
        padding:'clamp(14px,3.5vw,18px) clamp(22px,6vw,30px) clamp(18px,4.5vw,24px)',
        borderRadius:'0 0 24px 24px',
      }}>
        <p style={{
          fontWeight:700,
          fontStyle:'italic',
          fontSize:'clamp(13px,3.5vw,15px)',
          lineHeight:1.55,
          letterSpacing:'-0.005em',
          color: group ? (group.text === 'white' ? 'rgba(255,255,255,0.9)' : 'rgba(58,42,0,0.75)') : '#7A7A7A',
          margin:0,
        }}>
          {scene.question}
        </p>
      </div>
    </div>
  );
}

/* ─── BTN ───────────────────────────────────────────────────── */
function Btn({ children, onClick, ghost, small, disabled }) {
  const [hov, setHov] = React.useState(false);
  return (
    <button
      onClick={disabled ? undefined : onClick}
      disabled={disabled}
      onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
      style={{
        fontFamily:'Nunito', fontWeight:700, cursor: disabled ? 'default' : 'pointer',
        fontSize: small ? 10 : 11, letterSpacing:'0.18em', textTransform:'uppercase',
        padding: small ? '12px 22px' : '14px 28px', borderRadius:100,
        background: disabled ? '#E8E6E1' : ghost ? 'transparent' : '#1A1A1A',
        color: disabled ? '#B0A898' : ghost ? '#5A5A5A' : '#fff',
        border: ghost ? '1px solid rgba(0,0,0,0.13)' : 'none',
        transform: (!disabled && hov) ? 'translateY(-2px)' : 'translateY(0)',
        transition:'transform 0.2s, box-shadow 0.2s',
        boxShadow: (!disabled && hov && !ghost) ? '0 8px 20px -6px rgba(0,0,0,0.35)' : 'none',
      }}
    >{children}</button>
  );
}

/* ─── WELCOME SCREEN ────────────────────────────────────────── */
function WelcomeScreen({ onStart, onListOpen }) {
  return (
    <div style={{ display:'flex', flexDirection:'column', flex:1, overflowY:'auto', background:'#FAF7F2' }}>
      <div style={{ padding:'clamp(14px,4vw,20px) clamp(16px,5vw,24px) 0', display:'flex', justifyContent:'flex-end', flexShrink:0 }}>
        <button onClick={onListOpen} style={{
          width:42, height:42, borderRadius:'50%', background:'#fff', border:'1px solid rgba(0,0,0,0.08)',
          display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer',
          boxShadow:'0 4px 12px -4px rgba(0,0,0,0.1)', flexShrink:0,
        }}>
          <RainbowRings size={12} />
        </button>
      </div>
      <div style={{
        flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
        padding:'0 28px 0',
        minHeight:0,
      }}>
        <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:20, marginBottom:36 }}>
          <RainbowRings size={18} />
          <div style={{ textAlign:'center' }}>
            <div style={{ fontWeight:900, fontSize:'clamp(28px,8vw,40px)', letterSpacing:'-0.025em', color:'#1A1A1A', lineHeight:1 }}>Duygu</div>
            <div style={{ fontWeight:400, fontStyle:'italic', fontSize:'clamp(28px,8vw,40px)', letterSpacing:'-0.01em', color:'#5A5A5A', lineHeight:1 }}>Dedektifi</div>
          </div>
          <div style={{ fontSize:10, letterSpacing:'0.22em', color:'#A0A0A0', textTransform:'uppercase' }}>Sahne · Duygu · Tahmin</div>
        </div>

        <div style={{ display:'flex', gap:6, marginBottom:40, flexWrap:'wrap', justifyContent:'center' }}>
          {GROUPS.map((g,i) => (
            <div key={i} style={{
              width:28, height:28, borderRadius:'50%', background:g.grad,
              boxShadow:'0 4px 10px -3px rgba(0,0,0,0.2)',
            }}/>
          ))}
        </div>

        <div style={{ background:'#fff', borderRadius:20, padding:'22px 20px', marginBottom:36, width:'100%', maxWidth:440 }}>
          <div style={{ fontSize:9, letterSpacing:'0.22em', textTransform:'uppercase', color:'#A0A0A0', marginBottom:16, fontWeight:700 }}>Nasıl oynanır</div>
          {[
            ['1', 'Duygu çek', 'Kart bulanık gelir — sadece sen görürsün'],
            ['2', 'Sahneyi oku', 'Sahneyi duygunla yorumla, soruyu cevapla'],
            ['3', 'Tahmin', 'Diğerleri senin duygunun ne olduğunu bulmalı'],
          ].map(([n, t, d]) => (
            <div key={n} style={{ display:'flex', gap:12, alignItems:'flex-start', marginBottom: n==='3' ? 0 : 14 }}>
              <div style={{
                width:26, height:26, borderRadius:'50%', background:'#1A1A1A', color:'#fff',
                fontSize:12, fontWeight:900, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0,
              }}>{n}</div>
              <div>
                <div style={{ fontWeight:800, fontSize:14, color:'#1A1A1A' }}>{t}</div>
                <div style={{ fontSize:12, color:'#5A5A5A', marginTop:2, lineHeight:1.4 }}>{d}</div>
              </div>
            </div>
          ))}
        </div>
      </div>

      <div style={{ padding:'16px 28px calc(env(safe-area-inset-bottom, 0px) + 28px)', display:'flex', justifyContent:'center' }}>
        <Btn onClick={onStart}>Oyuna Başla</Btn>
      </div>
    </div>
  );
}

/* ─── PLAYER SETUP ──────────────────────────────────────────── */
const PLAYER_ANIMALS = ['🦊','🐸','🐯','🐧','🦄','🐙','🦁','🐺'];

const PLAYER_GRADS = [
  'linear-gradient(135deg,#FF6B7A,#E63946)',
  'linear-gradient(135deg,#FF8C42,#FF6B00)',
  'linear-gradient(135deg,#FFC93C,#F4A400)',
  'linear-gradient(135deg,#2ED573,#1DB954)',
  'linear-gradient(135deg,#2E9CFF,#0072F5)',
  'linear-gradient(135deg,#B14AED,#7B2FBE)',
  'linear-gradient(135deg,#FF4757,#B14AED)',
  'linear-gradient(135deg,#3D5AFE,#2E9CFF)',
];

function PlayerSetup({ onStart }) {
  const [name, setName] = React.useState('');
  const [players, setPlayers] = React.useState([]);

  function addPlayer() {
    const trimmed = name.trim();
    if (!trimmed || players.length >= 8) return;
    setPlayers(p => [...p, trimmed]);
    setName('');
  }

  function removePlayer(i) {
    setPlayers(p => p.filter((_, idx) => idx !== i));
  }

  function handleKey(e) {
    if (e.key === 'Enter') addPlayer();
  }

  const canStart = players.length >= 2;

  return (
    <div style={{ display:'flex', flexDirection:'column', flex:1, background:'#FAF7F2', overflow:'hidden' }}>

      {/* Başlık */}
      <div style={{ padding:'clamp(24px,6vw,36px) clamp(20px,5vw,28px) 0', flexShrink:0, textAlign:'center' }}>
        <div style={{ fontSize:'clamp(32px,9vw,44px)', fontWeight:900, letterSpacing:'-0.03em', lineHeight:1, color:'#1A1A1A' }}>
          Kim<em style={{ fontStyle:'italic', fontWeight:400, color:'#B14AED' }}> oynuyor?</em>
        </div>
        <div style={{ fontSize:12, color:'#A0A0A0', marginTop:8, fontWeight:700, letterSpacing:'0.1em', textTransform:'uppercase' }}>
          {players.length === 0 ? 'İsim ekle, oyunu başlat' : `${players.length} oyuncu hazır`}
        </div>
      </div>

      {/* Oyuncu grid */}
      <div style={{ flex:1, padding:'20px clamp(20px,5vw,28px) 0', overflowY:'auto' }}>
        <div style={{ display:'flex', flexWrap:'wrap', gap:10 }}>
          {players.map((p, i) => (
            <div key={i} style={{
              position:'relative',
              width:'calc(50% - 5px)',
              background: PLAYER_GRADS[i % PLAYER_GRADS.length],
              borderRadius:24, padding:'18px 14px 16px',
              boxShadow:'0 6px 20px -6px rgba(0,0,0,0.25)',
              animation:'enter 0.3s cubic-bezier(0.2,0.8,0.2,1) both',
              display:'flex', flexDirection:'column', alignItems:'center', gap:8,
            }}>
              <span style={{ fontSize:34, lineHeight:1 }}>{PLAYER_ANIMALS[i % PLAYER_ANIMALS.length]}</span>
              <span style={{
                fontWeight:900, fontSize:'clamp(14px,4vw,17px)',
                color:'#fff', letterSpacing:'-0.01em',
                textShadow:'0 1px 3px rgba(0,0,0,0.15)',
                textAlign:'center', wordBreak:'break-word',
              }}>{p}</span>
              <button onClick={() => removePlayer(i)} style={{
                position:'absolute', top:8, right:8,
                width:26, height:26, borderRadius:'50%',
                background:'rgba(255,255,255,0.25)',
                border:'none', fontSize:15, cursor:'pointer', color:'#fff',
                display:'flex', alignItems:'center', justifyContent:'center', lineHeight:1,
              }}>×</button>
            </div>
          ))}
        </div>

        {players.length === 0 && (
          <div style={{
            display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
            gap:12, padding:'40px 0', color:'#C8C0B8',
          }}>
            <div style={{ fontSize:40 }}>👥</div>
            <div style={{ fontSize:14, fontWeight:700 }}>Henüz kimse yok</div>
          </div>
        )}
      </div>

      {/* Input + Ekle */}
      <div style={{ padding:'16px clamp(20px,5vw,28px) 12px', display:'flex', gap:8, flexShrink:0 }}>
        <input
          value={name}
          onChange={e => setName(e.target.value)}
          onKeyDown={handleKey}
          placeholder="İsim gir..."
          maxLength={20}
          autoComplete="off"
          style={{
            flex:1, fontFamily:'Nunito', fontWeight:800, fontSize:16,
            padding:'14px 20px', borderRadius:100,
            border:'2.5px solid',
            borderColor: name.trim() ? '#B14AED' : 'rgba(0,0,0,0.1)',
            background:'#fff', outline:'none', color:'#1A1A1A',
            transition:'border-color 0.2s',
          }}
        />
        <button
          onClick={addPlayer}

/* ─── EMOTION SCREEN ────────────────────────────────────────── */
function EmotionScreen({ playerName, playerGrad, playerAnimal, onScenePhase, onListOpen, onScoreOpen }) {
  const [phase, setPhase] = React.useState('deck');
  const [emotion, setEmotion] = React.useState(null);
  const [group, setGroup] = React.useState(null);
  const [animKey, setAnimKey] = React.useState(0);
  const [shuffled] = React.useState(() => {
    const all = GROUPS.flatMap(g => g.emotions.map(e => ({ emotion:e, group:g })));
    return shuffle(all);
  });
  const [idx, setIdx] = React.useState(0);

  function draw() {
    const item = shuffled[idx % shuffled.length];
    setEmotion(item.emotion); setGroup(item.group); setAnimKey(k=>k+1); setPhase('drawn');
  }
  function redraw() {
    const next = (idx+1) % shuffled.length; setIdx(next);
    const item = shuffled[next];
    setEmotion(item.emotion); setGroup(item.group); setAnimKey(k=>k+1);
  }

  const bg = group ? group.tint : '#FAF7F2';

  return (
    <div style={{ display:'flex', flexDirection:'column', flex:1, background:bg, transition:'background 0.8s cubic-bezier(0.2,0.8,0.2,1)' }}>
      {/* Header */}
      <div style={{ padding:'clamp(10px,3vw,14px) clamp(16px,5vw,24px) 0', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
        {/* Sol: sıralama ikonu */}
        <button onClick={onScoreOpen} style={{
          width:36, height:36, borderRadius:'50%', background:'#fff', border:'1px solid rgba(0,0,0,0.08)',
          display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer',
          boxShadow:'0 4px 12px -4px rgba(0,0,0,0.1)', flexShrink:0,
        }}>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <rect x="1" y="8" width="3" height="7" rx="1" fill="#1A1A1A"/>
            <rect x="6" y="4" width="3" height="11" rx="1" fill="#1A1A1A"/>
            <rect x="11" y="1" width="3" height="14" rx="1" fill="#1A1A1A"/>
          </svg>
        </button>

        {/* Orta: oyuncu badge */}
        {playerName && (
          <div style={{ display:'inline-flex', alignItems:'center', gap:8, background: playerGrad, borderRadius:16, padding:'8px 14px 8px 10px', boxShadow:'0 4px 14px -4px rgba(0,0,0,0.25)' }}>
            <span style={{ fontSize:20, lineHeight:1 }}>{playerAnimal}</span>
            <span style={{ fontFamily:'Nunito', fontWeight:900, fontSize:'clamp(14px,4vw,17px)', letterSpacing:'-0.01em', color:'#fff', textShadow:'0 1px 3px rgba(0,0,0,0.15)' }}>{playerName}</span>
          </div>
        )}

        {/* Sağ: duygu listesi */}
        <button onClick={onListOpen} style={{
          width:36, height:36, borderRadius:'50%', background:'#fff', border:'1px solid rgba(0,0,0,0.08)',
          display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer',
          boxShadow:'0 4px 12px -4px rgba(0,0,0,0.1)', flexShrink:0,
        }}>
          <RainbowRings size={10} />
        </button>
      </div>

      {/* Content */}
      <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'clamp(16px,4vw,24px)', gap:'clamp(20px,5vw,32px)' }}>
        <div style={{ textAlign:'center' }}>
          <h1 style={{ fontWeight:400, fontStyle:'italic', fontSize:'clamp(22px,6vw,30px)', color:'#1A1A1A', marginBottom:8, lineHeight:1 }}>
            {phase === 'deck' ? 'Duygunu çek.' : 'Duygunla hazırlan.'}
          </h1>
          <p style={{ fontSize:'clamp(11px,3vw,13px)', color:'#5A5A5A', lineHeight:1.6, maxWidth:280 }}>
            {phase === 'deck'
              ? 'Desteye dokun, rastgele bir duygu atansın.'
              : 'Basılı tutarak sadece sen görebilirsin.'}
          </p>
        </div>

        {phase === 'deck' ? (
          <DeckVisual icon="?" label="Duygu Destesi" sub="70 Kart" onClick={draw} playerGrad={playerGrad} />
        ) : (
          <EmotionCard emotion={emotion} group={group} animKey={animKey} onShown={() => setPhase('ready')} onRedraw={phase === 'ready' ? redraw : null} />
        )}
      </div>

      {/* Actions */}
      <div style={{ padding:'0 clamp(16px,5vw,24px) calc(env(safe-area-inset-bottom,0px) + 24px)', display:'flex', justifyContent:'center', minHeight:64, alignItems:'center' }}>
        {phase === 'ready' && (
          <Btn small onClick={() => onScenePhase({ emotion, group })}>Sahne Zamanı →</Btn>
        )}
      </div>
    </div>
  );
}

/* ─── ICON CHANGE BTN ───────────────────────────────────────── */
function IconChangeBtn({ onClick, onMouseDown, onTouchStart, style, accentGrad, accentText, invertPress }) {
  const [hov, setHov] = React.useState(false);
  const [pressed, setPressed] = React.useState(false);
  const hasAccent = !!accentGrad;
  const bg  = hasAccent ? accentGrad : '#fff';
  const col = hasAccent ? (accentText || '#fff') : '#5A5A5A';
  return (
    <button
      onClick={onClick}
      onMouseEnter={() => setHov(true)} onMouseLeave={() => { setHov(false); setPressed(false); }}
      onMouseDown={e => { setPressed(true); onMouseDown && onMouseDown(e); }}
      onMouseUp={() => setPressed(false)}
      onTouchStart={e => { setPressed(true); onTouchStart && onTouchStart(e); }}
      onTouchEnd={() => setPressed(false)}

        width:28, height:28, borderRadius:'50%', flexShrink:0,

}

/* ─── SCENE SCREEN ──────────────────────────────────────────── */
function SceneScreen({ playerName, playerGrad, playerAnimal, emotionData, onTurnEnd, onRestart, onListOpen, onScoreOpen }) {
  const { emotion, group } = emotionData;

  const [isYouth, setIsYouth] = React.useState(false);
  const [shuffledAdult] = React.useState(() => shuffle(SCENES));
  const [shuffledYouth] = React.useState(() => shuffle(SCENES_GENC));
  const [idxAdult, setIdxAdult] = React.useState(0);
  const [idxYouth, setIdxYouth] = React.useState(0);

  const shuffled = isYouth ? shuffledYouth : shuffledAdult;
  const idx = isYouth ? idxYouth : idxAdult;
  const setIdx = isYouth ? setIdxYouth : setIdxAdult;
  const scene = shuffled[idx % shuffled.length];

  function randomScene() {
    const len = shuffled.length;
    let next;
    do { next = Math.floor(Math.random() * len); } while (len > 1 && next === idx);
    setIdx(next);
  }

  const TOTAL = 90;
  const [started, setStarted] = React.useState(false);
  const [timeLeft, setTimeLeft] = React.useState(TOTAL);
  const [ended, setEnded] = React.useState(false);

  React.useEffect(() => {
    if (!started || ended) return;
    if (timeLeft <= 0) { setEnded(true); onTurnEnd(); return; }
    const t = setTimeout(() => setTimeLeft(s => s - 1), 1000);
    return () => clearTimeout(t);
  }, [started, timeLeft, ended]);

  function handleEnd() {
    if (ended) return;
    setEnded(true);
    onTurnEnd();
  }

  const mins = Math.floor(timeLeft / 60);
  const secs = timeLeft % 60;
  const timeStr = `${mins}:${String(secs).padStart(2, '0')}`;
  const isUrgent = timeLeft <= 10;
  const progress = timeLeft / TOTAL;

  const cardW = 'min(280px, 72vw)';

  return (
    <div style={{ display:'flex', flexDirection:'column', flex:1, background:'#FAF7F2' }}>
      {/* Header */}
      <div style={{ padding:'clamp(10px,3vw,14px) clamp(16px,5vw,24px) 0', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
        {/* Sol: sıralama ikonu */}
        <button onClick={onScoreOpen} style={{
          width:36, height:36, borderRadius:'50%', background:'#fff', border:'1px solid rgba(0,0,0,0.08)',
          display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer',
          boxShadow:'0 4px 12px -4px rgba(0,0,0,0.1)', flexShrink:0,
        }}>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <rect x="1" y="8" width="3" height="7" rx="1" fill="#1A1A1A"/>
            <rect x="6" y="4" width="3" height="11" rx="1" fill="#1A1A1A"/>
            <rect x="11" y="1" width="3" height="14" rx="1" fill="#1A1A1A"/>
          </svg>
        </button>

        {/* Orta: oyuncu badge */}
        {playerName && (
          <div style={{ display:'inline-flex', alignItems:'center', gap:8, background: playerGrad, borderRadius:16, padding:'8px 14px 8px 10px', boxShadow:'0 4px 14px -4px rgba(0,0,0,0.25)' }}>
            <span style={{ fontSize:20, lineHeight:1 }}>{playerAnimal}</span>
            <span style={{ fontFamily:'Nunito', fontWeight:900, fontSize:'clamp(14px,4vw,17px)', letterSpacing:'-0.01em', color:'#fff', textShadow:'0 1px 3px rgba(0,0,0,0.15)' }}>{playerName}</span>
          </div>
        )}

        {/* Sağ: duygu listesi */}
        <button onClick={onListOpen} style={{
          width:36, height:36, borderRadius:'50%', background:'#fff', border:'1px solid rgba(0,0,0,0.08)',
          display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer',
          boxShadow:'0 4px 12px -4px rgba(0,0,0,0.1)', flexShrink:0,
        }}>
          <RainbowRings size={10} />
        </button>
      </div>

      {/* Content */}
      <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'clamp(10px,3vw,16px) clamp(16px,5vw,24px)', gap:'clamp(10px,2.5vw,14px)', overflow:'hidden' }}>
        <MiniChip emotion={emotion} group={group} />
        <SceneCard scene={scene} animKey={idx} displayNum={idx + 1} onChangeScene={randomScene} group={group} dark={isYouth} />
        <AgeToggle isYouth={isYouth} onChange={setIsYouth} />
      </div>

      {/* Alt çubuk */}
      <div style={{
        padding:'12px clamp(16px,5vw,24px) calc(env(safe-area-inset-bottom,0px) + 16px)',
        display:'flex', alignItems:'center', justifyContent:'center',
        borderTop:'1px solid rgba(0,0,0,0.06)', background:'#FAF7F2', flexShrink:0,
      }}>
        <div style={{ width:cardW, display:'flex', gap:8, height:48 }}>
          {/* Sol: Yeni Tur → Timer */}
          {!started ? (
            <button
              onClick={onRestart}
              style={{
                flex:1, height:'100%',
                fontFamily:'Nunito', fontWeight:800, fontSize:11, letterSpacing:'0.14em', textTransform:'uppercase',
                borderRadius:100,
                background:'linear-gradient(135deg,#B14AED,#3D5AFE)',
                color:'#fff', border:'none', cursor:'pointer',
                boxShadow:'0 6px 18px -4px rgba(100,60,220,0.45)',
              }}
            >Yeni Tur</button>
          ) : (
            <div style={{
              flex:1, height:'100%', display:'flex', alignItems:'center', justifyContent:'center', gap:7,
              background: isUrgent ? 'linear-gradient(135deg,#FF3B30,#FF6B35)' : '#1A1A1A',
              borderRadius:100,
              transition:'background 0.4s',
              boxShadow: isUrgent ? '0 6px 18px -4px rgba(255,59,48,0.55)' : 'none',
            }}>
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                <circle cx="6" cy="6" r="5" stroke="rgba(255,255,255,0.3)" strokeWidth="1.5" fill="none"/>
                <path
                  d={`M 6 6 L 6 1 A 5 5 0 ${progress > 0.5 ? 1 : 0} 1 ${6 + 5*Math.sin(2*Math.PI*(1-progress))} ${6 - 5*Math.cos(2*Math.PI*(1-progress))} Z`}
                  fill="rgba(255,255,255,0.65)"
                />
              </svg>
              <span style={{
                fontFamily:'Nunito', fontWeight:900, fontSize:16, letterSpacing:'-0.01em',
                color:'#fff', fontVariantNumeric:'tabular-nums',
              }}>{timeStr}</span>
            </div>
          )}

          {/* Sağ: Başla → Tamamla */}
          {!started ? (
            <button
              onClick={() => setStarted(true)}
              style={{
                flex:1, height:'100%',
                fontFamily:'Nunito', fontWeight:800, fontSize:11, letterSpacing:'0.14em', textTransform:'uppercase',
                borderRadius:100,
                background:'linear-gradient(135deg,#2ED573,#1DB954)',
                color:'#fff', border:'none', cursor:'pointer',
                boxShadow:'0 6px 18px -4px rgba(30,185,84,0.45)',
              }}
            >Başla</button>
          ) : (
            <button
              onClick={handleEnd}
              style={{
                flex:1, height:'100%',
                fontFamily:'Nunito', fontWeight:800, fontSize:11, letterSpacing:'0.14em', textTransform:'uppercase',
                borderRadius:100,
                background:'linear-gradient(135deg,#FF8C42,#FF3B30)',
                color:'#fff', border:'none', cursor:'pointer',
                boxShadow:'0 6px 18px -4px rgba(255,90,50,0.45)',
              }}
            >Tamamla</button>
          )}
        </div>
      </div>
    </div>
  );
}

/* ─── ROUND RESULT ──────────────────────────────────────────── */
function RoundResult({ players, currentPlayerIdx, onConfirm }) {
  const [selected, setSelected] = React.useState(null);

  // Karışık sıra — anlatan hariç + kimse bilemedi
  const [shuffledOthers] = React.useState(() => {
    const others = players
      .map((p, i) => ({ ...p, originalIdx: i }))
      .filter((_, i) => i !== currentPlayerIdx);
    return shuffle([...others, { name: 'Kimse bilemedi', originalIdx: 'none', isNone: true }]);
  });

  const anlatanGrad = PLAYER_GRADS[currentPlayerIdx % PLAYER_GRADS.length];

  return (
    <div style={{ display:'flex', flexDirection:'column', flex:1, background:'#FAF7F2', overflow:'hidden' }}>

      {/* Başlık */}
      <div style={{ padding:'clamp(24px,6vw,36px) clamp(20px,5vw,28px) 20px', flexShrink:0, textAlign:'center' }}>
        <div style={{ fontSize:11, letterSpacing:'0.2em', textTransform:'uppercase', color:'#A0A0A0', fontWeight:700, marginBottom:8 }}>
          Tur bitti
        </div>
        <div style={{ fontWeight:900, fontSize:'clamp(28px,8vw,38px)', letterSpacing:'-0.025em', lineHeight:1, color:'#1A1A1A' }}>
          Kim <em style={{ fontStyle:'italic', fontWeight:400, background: anlatanGrad, WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent', backgroundClip:'text' }}>buldu?</em>
        </div>
        <div style={{ fontSize:12, color:'#A0A0A0', marginTop:8, fontWeight:700 }}>
          {players[currentPlayerIdx].name} anlatıyordu
        </div>
      </div>

      <div style={{ flex:1, padding:'0 clamp(20px,5vw,28px)', overflowY:'auto', display:'flex', flexDirection:'column', justifyContent:'center' }}>
        {/* Oyuncular + Kimse bilemedi — tek grid */}
        <div style={{ display:'flex', flexWrap:'wrap', gap:10 }}>
          {shuffledOthers.map((p) => {
            const isSel = selected === p.originalIdx;
            const bg = p.isNone ? '#1A1A1A' : PLAYER_GRADS[p.originalIdx % PLAYER_GRADS.length];
            const icon = p.isNone ? '🤷' : PLAYER_ANIMALS[p.originalIdx % PLAYER_ANIMALS.length];
            return (
              <button
                key={String(p.originalIdx)}
                onClick={() => setSelected(p.originalIdx)}
                style={{
                  fontFamily:'Nunito',
                  width:'calc(50% - 5px)',
                  display:'flex', flexDirection:'column', alignItems:'center', gap:8,
                  padding:'20px 14px 16px', borderRadius:24,
                  background: bg,
                  border:'none', cursor:'pointer',
                  transform: isSel ? 'scale(1.04)' : 'scale(1)',
                  boxShadow: isSel ? '0 12px 32px -8px rgba(0,0,0,0.4)' : '0 4px 14px -4px rgba(0,0,0,0.18)',
                  opacity: isSel ? 1 : 0.72,
                  transition:'all 0.2s cubic-bezier(0.2,0.8,0.2,1)',
                }}
              >
                <span style={{ fontSize:38, lineHeight:1 }}>{icon}</span>
                <span style={{ fontWeight:900, fontSize:15, fontStyle: p.isNone ? 'italic' : 'normal', color:'#fff', lineHeight:1 }}>{p.name}</span>
              </button>
            );
          })}
        </div>
      </div>

      <div style={{ padding:'16px clamp(20px,5vw,28px) calc(env(safe-area-inset-bottom,0px) + 20px)', flexShrink:0 }}>
        <button
          onClick={() => selected !== null && onConfirm(selected)}
          style={{
            width:'100%',
            fontFamily:'Nunito', fontWeight:900, fontSize:'clamp(14px,4vw,17px)',
            letterSpacing:'0.06em', textTransform:'uppercase',
            padding:'17px 0', borderRadius:100,
            background: selected !== null
              ? 'linear-gradient(135deg,#2ED573 0%,#2E9CFF 50%,#B14AED 100%)'
              : '#E8E6E1',
            color: selected !== null ? '#fff' : '#B0A898',
            border:'none', cursor: selected !== null ? 'pointer' : 'default',
            boxShadow: selected !== null ? '0 10px 28px -6px rgba(80,160,255,0.4)' : 'none',
            transition:'all 0.3s cubic-bezier(0.2,0.8,0.2,1)',
            textShadow: selected !== null ? '0 1px 4px rgba(0,0,0,0.15)' : 'none',
          }}
        >Onayla →</button>
      </div>
    </div>
  );
}

      zIndex:100,
    }}>
      <div style={{ padding:'clamp(16px,5vw,24px) clamp(16px,5vw,24px) 12px', display:'flex', alignItems:'center', justifyContent:'space-between', flexShrink:0 }}>
        <div>
          <div style={{ fontWeight:900, fontSize:'clamp(18px,5vw,22px)', color:'#1A1A1A' }}>Duygu Havuzu</div>
          <div style={{ fontSize:10, letterSpacing:'0.18em', textTransform:'uppercase', color:'#A0A0A0', marginTop:3, fontWeight:700 }}>70 duygu · 7 renk ailesi</div>
        </div>
        <button onClick={onClose} style={{
          width:38, height:38, borderRadius:'50%', background:'rgba(0,0,0,0.07)',
          border:'none', fontSize:20, cursor:'pointer',
          display:'flex', alignItems:'center', justifyContent:'center', color:'#1A1A1A', fontFamily:'Nunito',
        }}>×</button>
      </div>

      <div style={{ flex:1, overflowY:'auto', padding:'0 clamp(16px,5vw,24px) calc(env(safe-area-inset-bottom,0px) + 24px)' }}>
        {GROUPS.map((g, gi) => (
          <div key={gi} style={{ marginBottom:28 }}>
            <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:12 }}>
              <div style={{ width:12, height:12, borderRadius:'50%', background:g.grad, flexShrink:0 }}/>
              <span style={{ fontSize:9, letterSpacing:'0.22em', textTransform:'uppercase', color:'#A0A0A0', fontWeight:700 }}>
                {g.name} Duygular
              </span>
            </div>
            <div style={{ display:'flex', flexWrap:'wrap', gap:7 }}>
              {g.emotions.map((e, ei) => (
                <div key={ei} style={{
                  padding:'9px 16px', borderRadius:100,
                  background:g.grad, color:g.text, fontWeight:700, fontSize:14,
                }}>{e}</div>
              ))}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ─── SCOREBOARD ────────────────────────────────────────────── */
function Scoreboard({ players, onContinue, onClose }) {
  const sorted = [...players]
    .map((p, i) => ({ ...p, originalIdx: i }))
    .sort((a, b) => b.score - a.score);

  const medals = ['🥇','🥈','🥉'];

  const isOverlay = !!onClose;

  return (
    <div style={{
      display:'flex', flexDirection:'column', flex:1, background:'#FAF7F2', overflow:'hidden',
      ...(isOverlay ? { position:'fixed', inset:0, zIndex:200 } : {}),
    }}>

      <div style={{ padding:'clamp(20px,5vw,28px) clamp(20px,5vw,28px) 16px', flexShrink:0, display:'flex', alignItems:'center', justifyContent:'space-between' }}>
        <div>
          <div style={{ fontSize:11, letterSpacing:'0.2em', textTransform:'uppercase', color:'#A0A0A0', fontWeight:700, marginBottom:4 }}>Skor</div>
          <div style={{ fontWeight:900, fontSize:'clamp(24px,7vw,32px)', letterSpacing:'-0.025em', lineHeight:1, color:'#1A1A1A' }}>
            Sıralama
          </div>
        </div>
        {isOverlay && (
          <button onClick={onClose} style={{
            width:38, height:38, borderRadius:'50%', background:'rgba(0,0,0,0.07)',
            border:'none', fontSize:20, cursor:'pointer',
            display:'flex', alignItems:'center', justifyContent:'center', color:'#1A1A1A', fontFamily:'Nunito',
          }}>×</button>
        )}
      </div>

      <div style={{ flex:1, padding:'0 clamp(20px,5vw,28px)', display:'flex', flexDirection:'column', gap:10, overflowY:'auto' }}>
        {sorted.map((p, rank) => {
          const g = PLAYER_GRADS[p.originalIdx % PLAYER_GRADS.length];
          const anml = PLAYER_ANIMALS[p.originalIdx % PLAYER_ANIMALS.length];
          const isFirst = rank === 0;
          return (
            <div key={p.originalIdx} style={{
              display:'flex', alignItems:'center', gap:14,
              background: isFirst ? g : '#fff',
              borderRadius:24, padding: isFirst ? '16px 20px' : '13px 20px',
              border: isFirst ? 'none' : '1px solid rgba(0,0,0,0.06)',
              boxShadow: isFirst ? '0 10px 28px -6px rgba(0,0,0,0.28)' : 'none',
              transform: isFirst ? 'scale(1.02)' : 'scale(1)',
            }}>
              <span style={{ fontSize: isFirst ? 28 : 22, lineHeight:1, flexShrink:0 }}>
                {rank < 3 ? medals[rank] : anml}
              </span>
              <div style={{ display:'flex', alignItems:'center', gap:10, flex:1, minWidth:0 }}>
                <span style={{ fontSize: isFirst ? 22 : 18, lineHeight:1, flexShrink:0 }}>{rank >= 3 ? '' : anml}</span>
                <span style={{
                  fontWeight:900, fontSize: isFirst ? 18 : 15,
                  color: isFirst ? '#fff' : '#1A1A1A',
                  overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap',
                }}>{p.name}</span>
              </div>
              <div style={{ textAlign:'right', flexShrink:0 }}>
                <span style={{
                  fontWeight:900, fontSize: isFirst ? 26 : 20,
                  color: isFirst ? '#fff' : '#1A1A1A',
                }}>{p.score > 0 ? `+${p.score}` : p.score}</span>
              </div>
            </div>
          );
        })}
      </div>

      {!isOverlay && (
        <div style={{ padding:'16px clamp(20px,5vw,28px) calc(env(safe-area-inset-bottom,0px) + 20px)', flexShrink:0 }}>
          <button
            onClick={onContinue}
            style={{
              width:'100%',
              fontFamily:'Nunito', fontWeight:900, fontSize:'clamp(15px,4vw,18px)',
              letterSpacing:'0.06em', textTransform:'uppercase',
              padding:'18px 0', borderRadius:100,
              background:'linear-gradient(135deg,#FF6B7A 0%,#FF8C42 35%,#FFC93C 65%,#2ED573 100%)',
              color:'#fff', border:'none', cursor:'pointer',
              boxShadow:'0 10px 28px -6px rgba(255,100,80,0.4)',
              textShadow:'0 1px 4px rgba(0,0,0,0.15)',
            }}
          >Devam →</button>
        </div>
      )}
    </div>
  );
}

/* ─── APP ───────────────────────────────────────────────────── */
function App() {
  const [screen, setScreen] = React.useState('welcome');
  const [players, setPlayers] = React.useState([]);
  const [currentPlayerIdx, setCurrentPlayerIdx] = React.useState(0);
  const [emotionData, setEmotionData] = React.useState(null);
  const [showList, setShowList] = React.useState(false);
  const [showScoreboard, setShowScoreboard] = React.useState(false);

  function startGame(playerNames) {
    setPlayers(playerNames.map(name => ({ name, score: 0 })));
    setCurrentPlayerIdx(0);
    setScreen('playerList');
  }

  function handleRoundResult(guessedIdx) {
    setPlayers(prev => {
      const updated = prev.map(p => ({ ...p }));
      if (guessedIdx === 'none') {
        updated[currentPlayerIdx].score -= 1;
      } else {
        updated[currentPlayerIdx].score += 1;
        updated[guessedIdx].score += 2;
      }
      return updated;
    });
    setCurrentPlayerIdx(i => (i + 1) % players.length);
    setEmotionData(null);
    setScreen('scoreboard');
  }

  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100%', position:'relative' }}>
      {screen === 'welcome' && (
        <WelcomeScreen onStart={() => setScreen('setup')} onListOpen={() => setShowList(true)} />
      )}
      {screen === 'setup' && (
        <PlayerSetup onStart={startGame} />
      )}
      {screen === 'playerList' && (
        <PlayerList
          players={players}
          currentPlayerIdx={currentPlayerIdx}
          onPlayerTap={() => setScreen('emotion')}
        />
      )}
      {screen === 'emotion' && (
        <EmotionScreen
          playerName={players[currentPlayerIdx]?.name}
          playerGrad={PLAYER_GRADS[currentPlayerIdx % PLAYER_GRADS.length]}
          playerAnimal={PLAYER_ANIMALS[currentPlayerIdx % PLAYER_ANIMALS.length]}
          onScenePhase={d => { setEmotionData(d); setScreen('scene'); }}
          onListOpen={() => setShowList(true)}
          onScoreOpen={() => setShowScoreboard(true)}
        />
      )}
      {screen === 'scene' && emotionData && (
        <SceneScreen
          playerName={players[currentPlayerIdx]?.name}
          playerGrad={PLAYER_GRADS[currentPlayerIdx % PLAYER_GRADS.length]}
          playerAnimal={PLAYER_ANIMALS[currentPlayerIdx % PLAYER_ANIMALS.length]}
          emotionData={emotionData}
          onTurnEnd={() => setScreen('roundResult')}
          onRestart={() => { setEmotionData(null); setScreen('emotion'); }}
          onListOpen={() => setShowList(true)}
          onScoreOpen={() => setShowScoreboard(true)}
        />
      )}
      {screen === 'roundResult' && (
        <RoundResult
          players={players}
          currentPlayerIdx={currentPlayerIdx}
          onConfirm={handleRoundResult}
        />
      )}
      {screen === 'scoreboard' && (
        <Scoreboard
          players={players}
          onContinue={() => setScreen('playerList')}
        />
      )}
      {showList && <EmotionListOverlay onClose={() => setShowList(false)} />}
      {showScoreboard && <Scoreboard players={players} onClose={() => setShowScoreboard(false)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

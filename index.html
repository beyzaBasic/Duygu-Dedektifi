<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Duygu Dedektifi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,700;1,900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      height: 100%;
      font-family: 'Nunito', system-ui, sans-serif;
      background: #FAF7F2;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }
    #root {
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    @keyframes enter {
      from { opacity: 0; transform: translateY(16px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes card-in {
      0%   { opacity: 0; transform: translateY(24px) scale(0.94); }
      60%  { transform: translateY(-4px) scale(1.02); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .enter    { animation: enter 0.4s cubic-bezier(0.2,0.8,0.2,1) both; }
    .card-in  { animation: card-in 0.5s cubic-bezier(0.2,0.8,0.2,1) both; }
  </style>
</head>
<body>
<div id="root"></div>
<script src="js/data/emotions.js"></script>
<script src="js/data/scenes.js"></script>
<script type="text/babel">

function shuffle(arr) {
  const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a;
}

/* ─── RAINBOW RINGS ─────────────────────────────────────────── */
function RainbowRings({ size = 12 }) {
  return (
    <span style={{
      display:'inline-block', width:size, height:size, borderRadius:'50%',
      background:'#FF4757', flexShrink:0,
      boxShadow:`0 0 0 ${size*0.2}px #FF8C42,0 0 0 ${size*0.4}px #FFC93C,0 0 0 ${size*0.6}px #2ED573,0 0 0 ${size*0.8}px #2E9CFF,0 0 0 ${size*1.0}px #3D5AFE,0 0 0 ${size*1.2}px #B14AED`
    }}/>
  );
}

/* ─── STEP DOTS ─────────────────────────────────────────────── */
function StepDots({ active }) {
  return (
    <div style={{ display:'flex', gap:8, justifyContent:'center', padding:'10px 0 0' }}>
      {[1,2].map(n => (
        <div key={n} style={{
          width:6, height:6, borderRadius:'50%',
          background:'#1A1A1A',
          opacity: active===n ? 1 : 0.18,
          transform: active===n ? 'scale(1.5)' : 'scale(1)',
          transition:'all 0.3s cubic-bezier(0.2,0.8,0.2,1)',
        }}/>
      ))}
    </div>
  );
}

/* ─── DECK VISUAL ───────────────────────────────────────────── */
function DeckVisual({ icon, label, sub, onClick }) {
  const [hovered, setHovered] = React.useState(false);
  return (
    <div
      onClick={onClick}
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => setHovered(false)}
      style={{ position:'relative', width:'min(200px, 52vw)', aspectRatio:'5/7', cursor:'pointer', userSelect:'none' }}
    >
      {[
        { r:-6, tx:-10, ty:6, op:0.45 },
        { r: 4, tx:  8, ty:3, op:0.65 },
      ].map((c,i) => (
        <div key={i} style={{
          position:'absolute', inset:0, borderRadius:20,
          background:'#fff', border:'1px solid rgba(0,0,0,0.07)',
          transform:`rotate(${c.r}deg) translate(${c.tx}px,${c.ty}px)`,
          opacity:c.op,
        }}/>
      ))}
      <div style={{
        position:'absolute', inset:0, borderRadius:20,
        background:'#fff', border:'1px solid rgba(0,0,0,0.06)',
        display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:14,
        boxShadow:'0 24px 48px -16px rgba(0,0,0,0.14)',
        transform: hovered ? 'translateY(-8px)' : 'translateY(0)',
        transition:'transform 0.3s cubic-bezier(0.2,0.8,0.2,1)',
      }}>
        <div style={{
          width:56, height:56, borderRadius:'50%', background:'#1A1A1A', color:'#fff',
          display:'flex', alignItems:'center', justifyContent:'center', fontSize:26, fontWeight:900,
        }}>{icon}</div>
        <div style={{ textAlign:'center' }}>
          <div style={{ fontWeight:900, fontSize:'clamp(16px,4vw,20px)', color:'#1A1A1A', lineHeight:1.1 }}>{label}</div>
          <div style={{ fontSize:9, letterSpacing:'0.25em', color:'#A0A0A0', textTransform:'uppercase', marginTop:8 }}>{sub}</div>
        </div>
      </div>
    </div>
  );
}

/* ─── EMOTION CARD ──────────────────────────────────────────── */
function EmotionCard({ emotion, group, onShown, animKey }) {
  const [revealed, setRevealed] = React.useState(false);
  const [entered, setEntered] = React.useState(false);
  React.useEffect(() => {
    setEntered(false); setRevealed(false);
    const t = setTimeout(() => { setEntered(true); if (onShown) onShown(); }, 60);
    return () => clearTimeout(t);
  }, [animKey]);
  const fontSize = emotion.length > 10 ? 'clamp(24px,7vw,34px)' : emotion.length > 7 ? 'clamp(30px,9vw,42px)' : 'clamp(36px,11vw,52px)';

  return (
    <div
      onMouseDown={() => setRevealed(true)}
      onMouseUp={() => setRevealed(false)}
      onMouseLeave={() => setRevealed(false)}
      onTouchStart={e => { e.preventDefault(); setRevealed(true); }}
      onTouchEnd={() => setRevealed(false)}
      style={{
        width:'min(260px, 66vw)', aspectRatio:'5/7', borderRadius:24,
        background:group.grad,
        display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
        position:'relative', overflow:'hidden',
        boxShadow:'0 32px 64px -24px rgba(0,0,0,0.3)',
        userSelect:'none', cursor:'pointer', touchAction:'none',
        transform: entered ? 'translateY(0) scale(1)' : 'translateY(24px) scale(0.95)',
        opacity: entered ? 1 : 0,
        transition:'transform 0.5s cubic-bezier(0.2,0.8,0.2,1), opacity 0.5s',
      }}
    >
      <div style={{
        color:group.text, fontWeight:900, fontSize, lineHeight:1, textAlign:'center', padding:'0 20px',
        filter: revealed ? 'blur(0)' : 'blur(20px)',
        transition: revealed ? 'filter 0.15s' : 'filter 0.4s',
      }}>{emotion}</div>

      <div style={{
        position:'absolute', inset:0,
        display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:10,
        opacity: revealed ? 0 : 1, transition:'opacity 0.2s', pointerEvents:'none',
      }}>
        <div style={{
          width:40, height:40, borderRadius:'50%',
          border:`1.5px solid ${group.text==='white'?'rgba(255,255,255,0.8)':'rgba(58,42,0,0.6)'}`,
          display:'flex', alignItems:'center', justifyContent:'center',
        }}>
          <div style={{ width:11, height:11, borderRadius:'50%', background:group.text==='white'?'rgba(255,255,255,0.8)':'rgba(58,42,0,0.6)' }}/>
        </div>
        <div style={{
          fontSize:9, letterSpacing:'0.22em', textTransform:'uppercase', textAlign:'center', lineHeight:1.5,
          color:group.text==='white'?'rgba(255,255,255,0.85)':'rgba(58,42,0,0.65)',
        }}>Görmek için<br/>dokun &amp; tut</div>
      </div>
    </div>
  );
}

/* ─── MINI CHIP ─────────────────────────────────────────────── */
function MiniChip({ emotion, group }) {
  const [peeking, setPeeking] = React.useState(false);
  return (
    <div
      onMouseDown={() => setPeeking(true)} onMouseUp={() => setPeeking(false)} onMouseLeave={() => setPeeking(false)}
      onTouchStart={e=>{e.preventDefault();setPeeking(true);}} onTouchEnd={() => setPeeking(false)}
      style={{
        display:'inline-flex', alignItems:'center', gap:14,
        padding:'12px 24px 12px 12px', borderRadius:100,
        background: group.grad,
        cursor:'pointer', userSelect:'none', touchAction:'none',
        boxShadow:`0 8px 24px -8px rgba(0,0,0,0.25)`,
      }}
    >
      <div style={{
        width:44, height:44, borderRadius:'50%', background:'rgba(255,255,255,0.25)', flexShrink:0,
        display:'flex', alignItems:'center', justifyContent:'center',
        filter: peeking ? 'blur(0)' : 'blur(0)',
      }}>
        <div style={{ width:20, height:20, borderRadius:'50%', background:'rgba(255,255,255,0.6)' }}/>
      </div>
      <span style={{
        fontWeight:900, fontStyle:'italic', fontSize:20, color: group.text,
        filter: peeking ? 'blur(0)' : 'blur(7px)',
        transition: peeking ? 'filter 0.1s' : 'filter 0.3s',
        letterSpacing:'-0.01em',
      }}>{emotion}</span>
    </div>
  );
}

/* ─── SCENE CARD ────────────────────────────────────────────── */
function SceneCard({ scene, animKey }) {
  const [entered, setEntered] = React.useState(false);
  React.useEffect(() => {
    setEntered(false);
    const t = setTimeout(() => setEntered(true), 60);
    return () => clearTimeout(t);
  }, [animKey]);
  return (
    <div style={{
      width:'min(280px, 72vw)', aspectRatio:'5/7',
      borderRadius:24, flexShrink:0,
      background:'#fff',
      boxShadow:'0 32px 64px -20px rgba(0,0,0,0.18)',
      display:'flex', flexDirection:'column',
      position:'relative', overflow:'hidden',
      transform: entered ? 'translateY(0) scale(1)' : 'translateY(28px) scale(0.95)',
      opacity: entered ? 1 : 0,
      transition:'transform 0.5s cubic-bezier(0.2,0.8,0.2,1), opacity 0.5s',
    }}>

      {/* ── Sahne no — sağ üst, diskret ── */}
      <div style={{
        position:'absolute', top:'clamp(14px,3.5vw,18px)', right:'clamp(16px,4vw,22px)',
        fontSize:8, letterSpacing:'0.28em', color:'#D0D0D0', textTransform:'uppercase', fontWeight:700,
      }}>
        №{String(animKey + 1).padStart(2,'0')}
      </div>

      {/* ── Sahne metni — büyük, rahat okunur ── */}
      <div style={{
        flex:1,
        padding:'clamp(22px,6vw,32px) clamp(22px,6vw,30px) clamp(16px,4vw,20px)',
        display:'flex', alignItems:'center',
      }}>
        <p style={{
          fontSize:'clamp(17px,5vw,21px)',
          lineHeight:1.75,
          color:'#1A1A1A',
          fontWeight:600,
          margin:0,
          letterSpacing:'-0.01em',
        }}>
          {scene.body}
        </p>
      </div>

      {/* ── Ayırıcı ── */}
      <div style={{
        margin:'0 clamp(22px,6vw,30px)',
        height:1,
        background:'rgba(0,0,0,0.08)',
        flex:'0 0 auto',
      }}/>

      {/* ── Soru — kremsi zemin, italik ── */}
      <div style={{
        flex:'0 0 auto',
        background:'#F7F4EE',
        padding:'clamp(14px,3.5vw,18px) clamp(22px,6vw,30px) clamp(18px,4.5vw,24px)',
        borderRadius:'0 0 24px 24px',
      }}>
        <p style={{
          fontWeight:700,
          fontStyle:'italic',
          fontSize:'clamp(13px,3.5vw,15px)',
          lineHeight:1.55,
          letterSpacing:'-0.005em',
          color:'#7A7A7A',
          margin:0,
        }}>
          {scene.question}
        </p>
      </div>
    </div>
  );
}

/* ─── BTN ───────────────────────────────────────────────────── */
function Btn({ children, onClick, ghost, small }) {
  const [hov, setHov] = React.useState(false);
  return (
    <button
      onClick={onClick}
      onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
      style={{
        fontFamily:'Nunito', fontWeight:700, cursor:'pointer',
        fontSize: small ? 10 : 11, letterSpacing:'0.18em', textTransform:'uppercase',
        padding: small ? '12px 22px' : '14px 28px', borderRadius:100,
        background: ghost ? 'transparent' : '#1A1A1A',
        color: ghost ? '#5A5A5A' : '#fff',
        border: ghost ? '1px solid rgba(0,0,0,0.13)' : 'none',
        transform: hov ? 'translateY(-2px)' : 'translateY(0)',
        transition:'transform 0.2s, box-shadow 0.2s',
        boxShadow: hov && !ghost ? '0 8px 20px -6px rgba(0,0,0,0.35)' : 'none',
      }}
    >{children}</button>
  );
}

/* ─── WELCOME SCREEN ────────────────────────────────────────── */
function WelcomeScreen({ onStart }) {
  return (
    <div style={{ display:'flex', flexDirection:'column', flex:1, overflowY:'auto', background:'#FAF7F2' }}>
      <div style={{
        flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
        padding:'env(safe-area-inset-top, 32px) 28px 0',
        minHeight:0,
      }}>
        <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:20, marginBottom:36 }}>
          <RainbowRings size={18} />
          <div style={{ textAlign:'center' }}>
            <div style={{ fontWeight:900, fontSize:'clamp(28px,8vw,40px)', letterSpacing:'-0.025em', color:'#1A1A1A', lineHeight:1 }}>Duygu</div>
            <div style={{ fontWeight:400, fontStyle:'italic', fontSize:'clamp(28px,8vw,40px)', letterSpacing:'-0.01em', color:'#5A5A5A', lineHeight:1 }}>Dedektifi</div>
          </div>
          <div style={{ fontSize:10, letterSpacing:'0.22em', color:'#A0A0A0', textTransform:'uppercase' }}>Sahne · Duygu · Tahmin</div>
        </div>

        <div style={{ display:'flex', gap:6, marginBottom:40, flexWrap:'wrap', justifyContent:'center' }}>
          {GROUPS.map((g,i) => (
            <div key={i} style={{
              width:28, height:28, borderRadius:'50%', background:g.grad,
              boxShadow:'0 4px 10px -3px rgba(0,0,0,0.2)',
            }}/>
          ))}
        </div>

        <div style={{ background:'#fff', borderRadius:20, padding:'22px 20px', marginBottom:36, width:'100%', maxWidth:440 }}>
          <div style={{ fontSize:9, letterSpacing:'0.22em', textTransform:'uppercase', color:'#A0A0A0', marginBottom:16, fontWeight:700 }}>Nasıl oynanır</div>
          {[
            ['1', 'Duygu çek', 'Kart bulanık gelir — sadece sen görürsün'],
            ['2', 'Sahneyi oku', 'Sahneyi duygunla yorumla, soruyu cevapla'],
            ['3', 'Tahmin', 'Diğerleri senin duygunun ne olduğunu bulmalı'],
          ].map(([n, t, d]) => (
            <div key={n} style={{ display:'flex', gap:12, alignItems:'flex-start', marginBottom: n==='3' ? 0 : 14 }}>
              <div style={{
                width:26, height:26, borderRadius:'50%', background:'#1A1A1A', color:'#fff',
                fontSize:12, fontWeight:900, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0,
              }}>{n}</div>
              <div>
                <div style={{ fontWeight:800, fontSize:14, color:'#1A1A1A' }}>{t}</div>
                <div style={{ fontSize:12, color:'#5A5A5A', marginTop:2, lineHeight:1.4 }}>{d}</div>
              </div>
            </div>
          ))}
        </div>
      </div>

      <div style={{ padding:'16px 28px calc(env(safe-area-inset-bottom, 0px) + 28px)', display:'flex', justifyContent:'center' }}>
        <Btn onClick={onStart}>Oyuna Başla</Btn>
      </div>
    </div>
  );
}

/* ─── EMOTION SCREEN ────────────────────────────────────────── */
function EmotionScreen({ onScenePhase, onListOpen }) {
  const [phase, setPhase] = React.useState('deck');
  const [emotion, setEmotion] = React.useState(null);
  const [group, setGroup] = React.useState(null);
  const [animKey, setAnimKey] = React.useState(0);
  const [shuffled] = React.useState(() => {
    const all = GROUPS.flatMap(g => g.emotions.map(e => ({ emotion:e, group:g })));
    return shuffle(all);
  });
  const [idx, setIdx] = React.useState(0);

  function draw() {
    const item = shuffled[idx % shuffled.length];
    setEmotion(item.emotion); setGroup(item.group); setAnimKey(k=>k+1); setPhase('drawn');
  }
  function redraw() {
    const next = (idx+1) % shuffled.length; setIdx(next);
    const item = shuffled[next];
    setEmotion(item.emotion); setGroup(item.group); setAnimKey(k=>k+1);
  }

  const bg = group ? group.tint : '#FAF7F2';

  return (
    <div style={{ display:'flex', flexDirection:'column', flex:1, background:bg, transition:'background 0.8s cubic-bezier(0.2,0.8,0.2,1)' }}>
      {/* Header */}
      <div style={{ padding:'clamp(14px,4vw,20px) clamp(16px,5vw,24px) 0', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
        <div style={{ fontWeight:900, fontSize:'clamp(16px,4.5vw,20px)', letterSpacing:'-0.02em', color:'#1A1A1A' }}>
          Duygu <em style={{ fontWeight:400, color:'#5A5A5A' }}>Dedektifi</em>
        </div>
        <button onClick={onListOpen} style={{
          width:42, height:42, borderRadius:'50%', background:'#fff', border:'1px solid rgba(0,0,0,0.08)',
          display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer',
          boxShadow:'0 4px 12px -4px rgba(0,0,0,0.1)', flexShrink:0,
        }}>
          <RainbowRings size={12} />
        </button>
      </div>

      <StepDots active={1} />

      {/* Content */}
      <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'clamp(16px,4vw,24px)', gap:'clamp(20px,5vw,32px)' }}>
        <div style={{ textAlign:'center' }}>
          <h1 style={{ fontWeight:400, fontStyle:'italic', fontSize:'clamp(22px,6vw,30px)', color:'#1A1A1A', marginBottom:8, lineHeight:1 }}>
            {phase === 'deck' ? 'Duygunu çek.' : 'Duygunla hazırlan.'}
          </h1>
          <p style={{ fontSize:'clamp(11px,3vw,13px)', color:'#5A5A5A', lineHeight:1.6, maxWidth:280 }}>
            {phase === 'deck'
              ? 'Desteye dokun, rastgele bir duygu atansın.'
              : 'Basılı tutarak sadece sen görebilirsin.'}
          </p>
        </div>

        {phase === 'deck' ? (
          <DeckVisual icon="?" label="Duygu Destesi" sub="70 Kart" onClick={draw} />
        ) : (
          <EmotionCard emotion={emotion} group={group} animKey={animKey} onShown={() => setPhase('ready')} />
        )}
      </div>

      {/* Actions */}
      <div style={{ padding:'0 clamp(16px,5vw,24px) calc(env(safe-area-inset-bottom,0px) + 24px)', display:'flex', gap:10, justifyContent:'center', flexWrap:'wrap', minHeight:64 }}>
        {phase === 'ready' && (
          <>
            <Btn ghost small onClick={redraw}>Başka Kart</Btn>
            <Btn small onClick={() => onScenePhase({ emotion, group })}>Sahne Zamanı →</Btn>
          </>
        )}
      </div>
    </div>
  );
}

/* ─── SCENE SCREEN ──────────────────────────────────────────── */
function SceneScreen({ emotionData, onRestart, onListOpen }) {
  const { emotion, group } = emotionData;
  const [shuffled] = React.useState(() => shuffle(SCENES));
  const [idx, setIdx] = React.useState(0);
  const scene = shuffled[idx % shuffled.length];

  return (
    <div style={{ display:'flex', flexDirection:'column', flex:1, background:'#FAF7F2' }}>
      {/* Header */}
      <div style={{ padding:'clamp(14px,4vw,20px) clamp(16px,5vw,24px) 0', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
        <div style={{ fontWeight:900, fontSize:'clamp(16px,4.5vw,20px)', letterSpacing:'-0.02em', color:'#1A1A1A' }}>
          Duygu <em style={{ fontWeight:400, color:'#5A5A5A' }}>Dedektifi</em>
        </div>
        <button onClick={onListOpen} style={{
          width:42, height:42, borderRadius:'50%', background:'#fff', border:'1px solid rgba(0,0,0,0.08)',
          display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer',
          boxShadow:'0 4px 12px -4px rgba(0,0,0,0.1)', flexShrink:0,
        }}>
          <RainbowRings size={12} />
        </button>
      </div>

      <StepDots active={2} />

      {/* Scrollable */}
      <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'clamp(14px,4vw,20px) clamp(16px,5vw,24px)', gap:'clamp(16px,4vw,24px)', overflow:'hidden' }}>
        <div style={{ display:'flex', justifyContent:'center' }}>
          <MiniChip emotion={emotion} group={group} />
        </div>
        <SceneCard scene={scene} animKey={idx} />
      </div>

      {/* Actions */}
      <div style={{
        padding:'12px clamp(16px,5vw,24px) calc(env(safe-area-inset-bottom,0px) + 20px)',
        display:'flex', gap:10, justifyContent:'center', flexWrap:'wrap',
        borderTop:'1px solid rgba(0,0,0,0.06)', background:'#FAF7F2',
      }}>
        <Btn ghost small onClick={() => setIdx(i=>i+1)}>Başka Sahne</Btn>
        <Btn ghost small onClick={onRestart}>Yeni Tur</Btn>
      </div>
    </div>
  );
}

/* ─── EMOTION LIST OVERLAY ──────────────────────────────────── */
function EmotionListOverlay({ onClose }) {
  const [visible, setVisible] = React.useState(false);
  React.useEffect(() => { const t = setTimeout(() => setVisible(true), 30); return () => clearTimeout(t); }, []);

  return (
    <div style={{
      position:'fixed', inset:0,
      background:'#FAF7F2', display:'flex', flexDirection:'column',
      transform: visible ? 'translateY(0)' : 'translateY(100%)',
      transition:'transform 0.4s cubic-bezier(0.2,0.8,0.2,1)',
      zIndex:100,
    }}>
      <div style={{ padding:'clamp(16px,5vw,24px) clamp(16px,5vw,24px) 12px', display:'flex', alignItems:'center', justifyContent:'space-between', flexShrink:0 }}>
        <div>
          <div style={{ fontWeight:900, fontSize:'clamp(18px,5vw,22px)', color:'#1A1A1A' }}>Duygu Havuzu</div>
          <div style={{ fontSize:10, letterSpacing:'0.18em', textTransform:'uppercase', color:'#A0A0A0', marginTop:3, fontWeight:700 }}>70 duygu · 7 renk ailesi</div>
        </div>
        <button onClick={onClose} style={{
          width:38, height:38, borderRadius:'50%', background:'rgba(0,0,0,0.07)',
          border:'none', fontSize:20, cursor:'pointer',
          display:'flex', alignItems:'center', justifyContent:'center', color:'#1A1A1A', fontFamily:'Nunito',
        }}>×</button>
      </div>

      <div style={{ flex:1, overflowY:'auto', padding:'0 clamp(16px,5vw,24px) calc(env(safe-area-inset-bottom,0px) + 24px)' }}>
        {GROUPS.map((g, gi) => (
          <div key={gi} style={{ marginBottom:28 }}>
            <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:12 }}>
              <div style={{ width:12, height:12, borderRadius:'50%', background:g.grad, flexShrink:0 }}/>
              <span style={{ fontSize:9, letterSpacing:'0.22em', textTransform:'uppercase', color:'#A0A0A0', fontWeight:700 }}>
                {g.name} Duygular
              </span>
            </div>
            <div style={{ display:'flex', flexWrap:'wrap', gap:7 }}>
              {g.emotions.map((e, ei) => (
                <div key={ei} style={{
                  padding:'9px 16px', borderRadius:100,
                  background:g.grad, color:g.text, fontWeight:700, fontSize:14,
                }}>{e}</div>
              ))}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ─── APP ───────────────────────────────────────────────────── */
function App() {
  const [screen, setScreen] = React.useState('welcome');
  const [emotionData, setEmotionData] = React.useState(null);
  const [showList, setShowList] = React.useState(false);

  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100%', position:'relative' }}>
      {screen === 'welcome' && <WelcomeScreen onStart={() => setScreen('emotion')} />}
      {screen === 'emotion' && (
        <EmotionScreen
          onScenePhase={d => { setEmotionData(d); setScreen('scene'); }}
          onListOpen={() => setShowList(true)}
        />
      )}
      {screen === 'scene' && emotionData && (
        <SceneScreen
          emotionData={emotionData}
          onRestart={() => { setEmotionData(null); setScreen('emotion'); }}
          onListOpen={() => setShowList(true)}
        />
      )}
      {showList && <EmotionListOverlay onClose={() => setShowList(false)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

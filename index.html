<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Duygu Avı</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,700;1,900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      height: 100%;
      font-family: 'Nunito', system-ui, sans-serif;
      background: #FAF7F2;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }
    #root {
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    @keyframes enter {
      from { opacity: 0; transform: translateY(16px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes card-in {
      0%   { opacity: 0; transform: translateY(24px) scale(0.94); }
      60%  { transform: translateY(-4px) scale(1.02); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes shake-wiggle {
      0%, 100% { transform: rotate(0deg); }
      20%      { transform: rotate(-12deg); }
      40%      { transform: rotate(10deg); }
      60%      { transform: rotate(-8deg); }
      80%      { transform: rotate(6deg); }
    }
    @keyframes pulse-ring {
      0%   { transform: scale(0.55); opacity: 0.45; }
      100% { transform: scale(1.45); opacity: 0; }
    }
    @keyframes float-y {
      0%, 100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-18px) scale(1.1); }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    @keyframes pop-in {
      0%   { opacity: 0; transform: translateY(14px) scale(0.9); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .enter    { animation: enter 0.4s cubic-bezier(0.2,0.8,0.2,1) both; }
    .card-in  { animation: card-in 0.5s cubic-bezier(0.2,0.8,0.2,1) both; }
  </style>
</head>
<body>
<div id="root"></div>

<!-- Data -->
<script src="js/data/emotions.js"></script>
<script src="js/data/scenes.js"></script>
<script src="js/data/players.js"></script>
<script src="js/data/strings.js"></script>

<!-- Shared UI components -->
<script type="text/babel" src="js/components/shared.js"></script>

<!-- Overlays -->
<script type="text/babel" src="js/screens/EmotionListOverlay.js"></script>

<!-- Screens -->
<script type="text/babel" src="js/screens/TutorialScreen.js"></script>
<script type="text/babel" src="js/screens/WelcomeScreen.js"></script>
<script type="text/babel" src="js/screens/PlayerSetup.js"></script>
<script type="text/babel" src="js/screens/PlayerList.js"></script>
<script type="text/babel" src="js/screens/TurnScreen.js"></script>
<script type="text/babel" src="js/screens/RoundResult.js"></script>
<script type="text/babel" src="js/screens/Scoreboard.js"></script>

<!-- App entry point -->
<script type="text/babel" src="js/app.js"></script>

</body>
</html>
